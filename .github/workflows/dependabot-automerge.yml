name: Auto-merge Dependabot Minor and Patch Updates

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge minor and patch updates after tests pass
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # The Test workflow starts independently and may not be listed yet.
          while true; do
            state=$(gh run list --workflow ci.yml --event pull_request --branch "$HEAD_BRANCH" \
              --commit "$HEAD_SHA" --limit 1 --json status,conclusion \
              --jq '.[0] | if .status == "completed" then .conclusion else "pending" end')
            case "$state" in
              success) break ;;
              pending) sleep 15 ;;
              *) echo "Test did not succeed: $state"; exit 1 ;;
            esac
          done
          gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$HEAD_SHA"
